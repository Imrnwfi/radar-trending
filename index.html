<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Trending Imran Wafi</title>
<meta name="description" content="Topik trending tutorial app dan kewangan untuk channel Imran Wafi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one quiet column of title buttons; a button opens its details in place. */
:root{
  --paper:#f5f5f3; --panel:#ffffff; --ink:#16181d; --muted:#6a707c; --line:#e3e4e8;
  --accent:#2346c9; --tint-k:#e7f2ee; --ink-k:#2f6d61; --tint-t:#e8ecfb; --ink-t:#2346c9; --hot:#d13b2f; --rise:#c07a00; --steady:#3a8072;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0f1115; --panel:#171a20; --ink:#e9ebef; --muted:#9097a4; --line:#262a33;
    --accent:#8aa0ff; --tint-k:#163029; --ink-k:#7fd0be; --tint-t:#1c2340; --ink-t:#9fb1ff; --hot:#ff6f62; --rise:#f0b440; --steady:#6cc4b3; color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;padding:14px 14px}
.row:hover{background:color-mix(in srgb, var(--line) 35%, transparent)}
.ico{flex:0 0 auto;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--tint-k);color:var(--ink-k);position:relative}
.ico.tutorial{background:var(--tint-t);color:var(--ink-t)}
.ico svg{width:22px;height:22px}
.ico .dot{position:absolute;right:-3px;top:-3px;border:2px solid var(--panel);width:12px;height:12px}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--steady)}
.dot.panas{background:var(--hot)} .dot.naik{background:var(--rise)}
.t{flex:1;min-width:0;font-weight:700;line-height:1.3}
.item.done .t{color:var(--muted);text-decoration:line-through}
.fire{width:17px;height:17px;color:var(--hot);vertical-align:-2px;margin-right:5px}
.legend .fire{margin:0}
.s{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.chev{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.detail{padding:2px 14px 16px 66px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.detail p{margin:0;max-width:62ch}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tags{font-size:13px;color:var(--muted)}
.tags b{color:var(--hot);font-weight:700}
.ideas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:n}
.ideas li{display:flex;gap:8px;align-items:flex-start}
.ideas span{flex:1}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted)}
.app{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);align-self:flex-start;max-width:100%}
.app .ico{width:26px;height:26px;border-radius:999px}
.app .ico svg{width:15px;height:15px}
.app small{color:var(--muted);font-weight:400}
.ideas li{counter-increment:n}
.ideas li::before{content:counter(n);flex:0 0 auto;width:20px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.src{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .btn.pri{color:#0f1115} }
.empty{color:var(--muted);padding:16px 0}
.more{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.banner{font-size:14px;color:var(--rise)}
.tl{display:flex;flex-direction:column;gap:18px}
.mon{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.ev{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ev li{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ev li::before{content:"";position:absolute;left:-26px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.ev li.soon{border-color:var(--hot)} .ev li.soon::before{border-color:var(--hot);background:var(--hot)}
.ev li.past{opacity:.5}
.evtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.evd{font-size:13px;font-weight:700;color:var(--accent)}
.cd{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.soon .cd{background:var(--hot);color:#fff}
.evl{font-weight:700;line-height:1.3}
.evn{font-size:14px;color:var(--muted)}
.up{font-size:13px;display:flex;align-items:center;gap:6px;color:var(--ink-k)}
.up.late{color:var(--hot);font-weight:700}
.up svg{width:15px;height:15px}
.go{align-self:flex-start;border:0;background:transparent;color:var(--accent);padding:0;font-size:14px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
@media (max-width:420px){.detail{padding-left:14px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Radar Trending</h1>
    <div class="meta" id="meta">Memuatkan…</div>
  </header>

  <div class="tabs" role="group" aria-label="Tapis kategori">
    <button class="tab" aria-pressed="true" data-f="semua">Semua</button>
    <button class="tab" aria-pressed="false" data-f="kewangan">Kewangan</button>
    <button class="tab" aria-pressed="false" data-f="tutorial">Tutorial</button>
    <button class="tab" aria-pressed="false" data-f="tarikh">Tarikh penting</button>
  </div>

  <div class="banner" id="banner"></div>
  <div class="list" id="list"></div>

  <div class="legend" id="legend">
    <span id="lgFire"></span>
    <span><i class="dot naik"></i>Naik</span>
    <span><i class="dot"></i>Stabil</span>
    <span>Nombor = skor potensi</span>
  </div>

  <div class="more">
    <label><input type="checkbox" id="hideDone"> Sembunyi yang dah buat</label>
    <span id="histWrap" hidden><label for="histSel">Senarai </label><select id="histSel"><option value="latest">Terkini</option></select></span>
  </div>

  <footer>Dikemas kini automatik setiap pagi. Skor ialah anggaran Claude berdasarkan berapa baru isu itu, berapa ramai terkesan dan kesesuaian dengan niche. Semak fakta di sumber rasmi sebelum rakam.</footer>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const state = { data:null, latest:null, filter:"semua", hideDone:false, done:{}, open:{}, viewing:"latest" };
  const statusLabel = { panas:"Panas", naik:"Naik", stabil:"Stabil" };
  const RANK = { panas:0, naik:1, stabil:2 };
  const FIRE = '<svg class="fire" viewBox="0 0 24 24" aria-label="Topik hangat" role="img"><path fill="currentColor" d="M12.5 2c.6 3.2-1.2 5-2.8 6.8C8.2 10.4 7 12 7 14.5 7 18 9.3 21 12.5 21S18 18.4 18 15c0-2.6-1.3-4.2-2.2-5.4-.3 1.5-1 2.6-2 3 .6-3.4-.2-7.4-1.3-10.6z"/><path fill="var(--panel)" opacity=".55" d="M12.6 12.5c-.9 1.3-2.1 2.3-2.1 4.1 0 1.6 1 2.9 2.2 2.9 1.3 0 2.3-1.1 2.3-2.7 0-1.5-.8-2.4-1.5-3.2-.2.7-.5 1.1-.9 1.3.2-.9.2-1.6 0-2.4z"/></svg>';
  const P = {
    passport:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/>',
    aid:'<path d="M3 11h4l3 2h4a2 2 0 0 1 0 4H9"/><path d="M14 15l5-2a2 2 0 0 1 2 3l-7 4H3"/><circle cx="15" cy="6" r="3"/>',
    card:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><rect x="5.5" y="9" width="5" height="4" rx="1"/><path d="M13 10h5M13 14h3"/>',
    learn:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
    tax:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16v.5"/>',
    chart:'<path d="M3 20h18"/><path d="M5 16l5-5 4 3 6-7"/><path d="M15 7h5v5"/>',
    id:'<rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="11" r="2.5"/><path d="M5 16c1-2 6-2 7 0M14 10h4M14 13h4"/>',
    shop:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    salary:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
    map:'<path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>',
    gold:'<path d="M3 19l2.5-6h6l2.5 6z"/><path d="M10 13l2.5-6h6l2.5 6"/><path d="M14 19h7l-1.5-4"/>',
    cart:'<path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
    link:'<path d="M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1"/><path d="M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1"/>'
  };
  function svg(k){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k] || P.link}</svg>`; }

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function safeUrl(u){ try{ const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; } }
  function items(){ return (state.data && Array.isArray(state.data.items)) ? state.data.items.slice().sort((a,b) => (RANK[a.status] ?? 2) - (RANK[b.status] ?? 2) || (b.score||0)-(a.score||0)) : []; }

  function render(){
    const d = state.data; if(!d) return;
    $("meta").textContent = (d.updated_label ? "Dikemas kini " + d.updated_label : "") + " · tekan tajuk untuk butiran";
    const isCal = state.filter === "tarikh";
    $("legend").hidden = isCal;
    if(isCal){
      const up = Array.isArray(d.upcoming) ? d.upcoming : [];
      $("list").innerHTML = up.length ? timelineHtml(up) : `<div class="empty">Tiada tarikh penting buat masa ini.</div>`;
      return;
    }
    let list = items().filter(i => state.filter === "semua" || i.cat === state.filter);
    if(state.hideDone) list = list.filter(i => !state.done[i.id]);
    $("list").innerHTML = list.length ? list.map(itemHtml).join("") : `<div class="empty">Tiada topik untuk tapisan ini.</div>`;
  }

  function itemHtml(i){
    const st = i.status in statusLabel ? i.status : "stabil";
    const open = !!state.open[i.id], done = !!state.done[i.id];
    const id = esc(i.id);
    const ideas = Array.isArray(i.ideas) ? i.ideas : [];
    const srcs = (Array.isArray(i.sources) ? i.sources : []).map(s => { const u = safeUrl(s.url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.name || "Sumber")}</a>` : ""; }).join("");
    return `<div class="item${done ? " done" : ""}">
      <button class="row" data-toggle="${id}" aria-expanded="${open}" aria-controls="d-${id}">
        <span class="ico ${i.cat === "tutorial" ? "tutorial" : ""}">${svg(i.icon)}<i class="dot ${st}" aria-label="${statusLabel[st]}"></i></span>
        <span class="t">${st === "panas" ? FIRE : ""}${esc(i.title)}</span>
        <span class="s">${Math.max(0, Math.min(100, Number(i.score) || 0))}</span>
        <i class="chev" aria-hidden="true"></i>
      </button>
      <div class="detail" id="d-${id}"${open ? "" : " hidden"}>
        <div class="tags">${statusLabel[st]} · ${i.cat === "kewangan" ? "Kewangan" : "Tutorial App & Web"}${i.deadline ? ` · <b>${esc(i.deadline)}</b>` : ""}</div>
        <div><div class="lbl">Kenapa trending</div><p>${esc(i.why)}</p></div>
        ${i.angle ? `<div><div class="lbl">Sudut video</div><p>${esc(i.angle)}</p></div>` : ""}
        ${appHtml(i)}
        ${ideas.length ? `<div><div class="lbl">Idea tajuk video (${ideas.length})</div><ul class="ideas">${ideas.map(t => `<li><span>${esc(t)}</span><button class="mini" data-copy="${esc(t)}">Salin</button></li>`).join("")}</ul></div>` : ""}
        ${srcs ? `<div class="src">Sumber: ${srcs}</div>` : ""}
        <div class="acts">
          <button class="btn pri" data-prompt="${id}">Salin prompt skrip video</button>
          ${state.viewing === "latest" ? `<button class="btn" data-done="${id}">${done ? "Buang tanda" : "Tanda dah buat"}</button>` : ""}
        </div>
      </div>
    </div>`;
  }

  const BULAN = ["JAN","FEB","MAC","APR","MEI","JUN","JUL","OGO","SEP","OKT","NOV","DIS"];
  const BLN = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogo","Sep","Okt","Nov","Dis"];
  function todayMY(){ const s = new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kuala_Lumpur"}); return new Date(s + "T00:00:00Z"); }
  function parseD(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s || "") ? new Date(s + "T00:00:00Z") : null; }
  function days(a,b){ return Math.round((b - a) / 86400000); }
  function cdText(n, approx){
    if(n < 0) return "Dah lepas";
    if(n === 0) return "Hari ini";
    if(n === 1) return "Esok";
    if(n < 60) return (approx ? "± " : "") + n + " hari lagi";
    return (approx ? "± " : "") + Math.round(n / 30) + " bulan lagi";
  }
  const UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  function timelineHtml(up){
    const t = todayMY();
    const rows = up.map(u => ({ u, w: parseD(u.when) }))
      .filter(r => !r.w || days(t, r.w) >= -1)
      .sort((a,b) => (a.w ? a.w.getTime() : Infinity) - (b.w ? b.w.getTime() : Infinity));
    const groups = [];
    rows.forEach(r => {
      const key = r.w ? BULAN[r.w.getUTCMonth()] + " " + r.w.getUTCFullYear() : "TARIKH BELUM PASTI";
      let g = groups[groups.length - 1]; if(!g || g.key !== key){ g = { key, rows: [] }; groups.push(g); } g.rows.push(r);
    });
    const topicIds = new Set(items().map(i => i.id));
    return `<div class="tl">${groups.map(g => `<section><h2 class="mon">${esc(g.key)}</h2><ul class="ev">${g.rows.map(({u, w}) => {
      const n = w ? days(t, w) : null;
      const soon = n !== null && n >= 0 && n <= 7;
      let upHtml = "";
      if(w && n >= 0){
        const lead = Math.max(1, Math.min(60, Number(u.lead) || 7));
        const ub = new Date(w.getTime() - lead * 86400000), m = days(t, ub);
        upHtml = m <= 0 ? `<div class="up late">${UP}Upload video sekarang</div>`
          : `<div class="up">${UP}Upload sebelum ${ub.getUTCDate()} ${BLN[ub.getUTCMonth()]}${u.approx ? " (anggaran)" : ""}</div>`;
      }
      return `<li class="${soon ? "soon" : ""}${n !== null && n < 0 ? " past" : ""}">
        <div class="evtop"><span class="evd">${esc(u.date)}</span>${n !== null ? `<span class="cd">${cdText(n, u.approx)}</span>` : ""}</div>
        <div class="evl">${esc(u.label)}</div>
        ${u.note ? `<div class="evn">${esc(u.note)}</div>` : ""}
        ${upHtml}
        ${u.topic && topicIds.has(u.topic) ? `<button class="go" data-goto="${esc(u.topic)}">Lihat topik &amp; idea tajuk →</button>` : ""}
      </li>`; }).join("")}</ul></section>`).join("")}</div>`;
  }
  function appHtml(i){
    const a = i.app; if(!a || !a.name) return "";
    const u = safeUrl(a.url); const cls = i.cat === "tutorial" ? "tutorial" : "";
    const inner = `<span class="ico ${cls}">${svg(i.icon)}</span><span>${esc(a.name)}${u ? ` <small>${esc(new URL(u).hostname.replace(/^www\./,""))}</small>` : ""}</span>`;
    return `<div><div class="lbl">App / laman berkaitan</div>${u ? `<a class="app" href="${esc(u)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="app">${inner}</span>`}</div>`;
  }
  function buildPrompt(item){
    const facts = { tajuk: item.title, kenapa_trending: item.why, sudut: item.angle, idea_tajuk: item.ideas, tarikh_akhir: item.deadline || null, sumber: (item.sources||[]).map(s => s.url) };
    return `Anda penulis skrip untuk channel YouTube Malaysia "Imran Wafi" (niche: tutorial app/website dan kewangan peribadi; gaya santai, bahasa Melayu harian).
Topik trending (fakta, JSON):
${JSON.stringify(facts, null, 1)}

Tulis pakej video dalam Bahasa Melayu. Guna hanya fakta di atas; jangan reka angka atau tarikh.
1. 5 tajuk YouTube (bawah 60 aksara)
2. 3 teks thumbnail (maksimum 4 perkataan)
3. Hook 15 saat pertama
4. Rangka video (5-7 bahagian, dengan anggaran minit)
5. 3 idea Shorts/TikTok
6. Tag & kata kunci carian
7. Perkara yang perlu disemak sebelum rakam`;
  }

  async function copy(text, btn){
    const o = btn.textContent;
    try{ await navigator.clipboard.writeText(text); btn.textContent = "Disalin"; }
    catch(e){ btn.textContent = "Tak dapat salin"; }
    setTimeout(() => btn.textContent = o, 1400);
  }

  function saveDone(){ try{ localStorage.setItem("rt-done", JSON.stringify(state.done)); }catch(e){} }

  document.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    if(b.dataset.f){ state.filter = b.dataset.f; document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t === b))); render(); }
    else if(b.dataset.toggle){ const id = b.dataset.toggle; state.open[id] = !state.open[id];
      b.setAttribute("aria-expanded", String(state.open[id])); const d = $("d-" + id); if(d) d.hidden = !state.open[id]; }
    else if(b.dataset.copy != null){ copy(b.dataset.copy, b); }
    else if(b.dataset.goto){ const id = b.dataset.goto; state.filter = "semua"; state.open[id] = true;
      document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t.dataset.f === "semua"))); render();
      const el = $("d-" + id); if(el) el.parentElement.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); }
    else if(b.dataset.prompt){ const it = items().find(x => x.id === b.dataset.prompt); if(it) copy(buildPrompt(it), b); }
    else if(b.dataset.done){ const id = b.dataset.done; if(state.done[id]) delete state.done[id]; else state.done[id] = 1; saveDone(); render(); }
  });
  $("hideDone").addEventListener("change", e => { state.hideDone = e.target.checked; render(); });

  async function getJson(p){ const r = await fetch(p + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }

  $("histSel").addEventListener("change", async e => {
    const v = e.target.value;
    if(v === "latest"){ state.viewing = "latest"; state.data = state.latest; $("banner").textContent = ""; render(); return; }
    try{ const d = await getJson("history/" + v + ".json"); state.viewing = v; state.data = d; state.open = {};
      $("banner").textContent = "Anda sedang lihat senarai lama (" + (d.updated_label || v) + "). Pilih \"Terkini\" untuk kembali."; render(); }catch(err){}
  });

  $("lgFire").innerHTML = FIRE + "Panas (paling atas)";
  (async function start(){
    try{ const s = JSON.parse(localStorage.getItem("rt-done") || "{}"); if(s && typeof s === "object") state.done = s; }catch(e){}
    try{ state.latest = state.data = await getJson("data.json"); render(); }
    catch(e){ $("meta").textContent = "Senarai tak dapat dimuatkan. Muat semula halaman ini."; return; }
    try{
      const idx = await getJson("history/index.json");
      const dates = (idx.dates || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d !== state.latest.date).sort().reverse().slice(0,14);
      if(dates.length){ $("histWrap").hidden = false; $("histSel").innerHTML = '<option value="latest">Terkini</option>' + dates.map(d => `<option value="${d}">${d}</option>`).join(""); }
    }catch(e){}
  })();
})();
</script>
</body>
</html>
