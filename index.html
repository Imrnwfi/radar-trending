<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Trending Imran Wafi</title>
<meta name="description" content="Topik trending tutorial app dan kewangan untuk channel Imran Wafi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one quiet column of title buttons; a button opens its details in place. */
:root{
  --paper:#f5f5f3; --panel:#ffffff; --ink:#16181d; --muted:#6a707c; --line:#e3e4e8;
  --accent:#2346c9; --hot:#d13b2f; --rise:#c07a00; --steady:#3a8072;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0f1115; --panel:#171a20; --ink:#e9ebef; --muted:#9097a4; --line:#262a33;
    --accent:#8aa0ff; --hot:#ff6f62; --rise:#f0b440; --steady:#6cc4b3; color-scheme:dark; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin:0}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:999px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:0;padding:14px 14px}
.row:hover{background:color-mix(in srgb, var(--line) 35%, transparent)}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--steady)}
.dot.panas{background:var(--hot)} .dot.naik{background:var(--rise)}
.t{flex:1;min-width:0;font-weight:700;line-height:1.3}
.item.done .t{color:var(--muted);text-decoration:line-through}
.s{flex:0 0 auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.chev{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(-135deg);margin:4px 4px 0 0}
.detail{padding:0 14px 16px 35px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.detail p{margin:0;max-width:62ch}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tags{font-size:13px;color:var(--muted)}
.tags b{color:var(--hot);font-weight:700}
.ideas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ideas li{display:flex;gap:8px;align-items:flex-start}
.ideas span{flex:1}
.mini{border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted)}
.src{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:700}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .btn.pri{color:#0f1115} }
.empty{color:var(--muted);padding:16px 0}
.more{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.banner{font-size:14px;color:var(--rise)}
.cal{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.cal .d{font-size:13px;font-weight:700;color:var(--accent)}
.cal .n{font-size:14px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Radar Trending</h1>
    <div class="meta" id="meta">Memuatkan…</div>
  </header>

  <div class="tabs" role="group" aria-label="Tapis kategori">
    <button class="tab" aria-pressed="true" data-f="semua">Semua</button>
    <button class="tab" aria-pressed="false" data-f="kewangan">Kewangan</button>
    <button class="tab" aria-pressed="false" data-f="tutorial">Tutorial</button>
    <button class="tab" aria-pressed="false" data-f="tarikh">Tarikh penting</button>
  </div>

  <div class="banner" id="banner"></div>
  <div class="list" id="list"></div>

  <div class="legend" id="legend">
    <span><i class="dot panas"></i>Panas</span>
    <span><i class="dot naik"></i>Naik</span>
    <span><i class="dot"></i>Stabil</span>
    <span>Nombor = skor potensi</span>
  </div>

  <div class="more">
    <label><input type="checkbox" id="hideDone"> Sembunyi yang dah buat</label>
    <span id="histWrap" hidden><label for="histSel">Senarai </label><select id="histSel"><option value="latest">Terkini</option></select></span>
  </div>

  <footer>Dikemas kini automatik setiap pagi. Skor ialah anggaran Claude berdasarkan berapa baru isu itu, berapa ramai terkesan dan kesesuaian dengan niche. Semak fakta di sumber rasmi sebelum rakam.</footer>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const state = { data:null, latest:null, filter:"semua", hideDone:false, done:{}, open:{}, viewing:"latest" };
  const statusLabel = { panas:"Panas", naik:"Naik", stabil:"Stabil" };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function safeUrl(u){ try{ const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : null; }catch(e){ return null; } }
  function items(){ return (state.data && Array.isArray(state.data.items)) ? state.data.items.slice().sort((a,b) => (b.score||0)-(a.score||0)) : []; }

  function render(){
    const d = state.data; if(!d) return;
    $("meta").textContent = (d.updated_label ? "Dikemas kini " + d.updated_label : "") + " · tekan tajuk untuk butiran";
    const isCal = state.filter === "tarikh";
    $("legend").hidden = isCal;
    if(isCal){
      const up = Array.isArray(d.upcoming) ? d.upcoming : [];
      $("list").innerHTML = up.length ? `<div class="item" style="padding:14px"><ul class="cal">${up.map(u => `<li><div class="d">${esc(u.date)}</div><div><b>${esc(u.label)}</b></div>${u.note ? `<div class="n">${esc(u.note)}</div>` : ""}</li>`).join("")}</ul></div>` : `<div class="empty">Tiada tarikh penting buat masa ini.</div>`;
      return;
    }
    let list = items().filter(i => state.filter === "semua" || i.cat === state.filter);
    if(state.hideDone) list = list.filter(i => !state.done[i.id]);
    $("list").innerHTML = list.length ? list.map(itemHtml).join("") : `<div class="empty">Tiada topik untuk tapisan ini.</div>`;
  }

  function itemHtml(i){
    const st = i.status in statusLabel ? i.status : "stabil";
    const open = !!state.open[i.id], done = !!state.done[i.id];
    const id = esc(i.id);
    const ideas = Array.isArray(i.ideas) ? i.ideas : [];
    const srcs = (Array.isArray(i.sources) ? i.sources : []).map(s => { const u = safeUrl(s.url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.name || "Sumber")}</a>` : ""; }).join("");
    return `<div class="item${done ? " done" : ""}">
      <button class="row" data-toggle="${id}" aria-expanded="${open}" aria-controls="d-${id}">
        <i class="dot ${st}" aria-label="${statusLabel[st]}"></i>
        <span class="t">${esc(i.title)}</span>
        <span class="s">${Math.max(0, Math.min(100, Number(i.score) || 0))}</span>
        <i class="chev" aria-hidden="true"></i>
      </button>
      <div class="detail" id="d-${id}"${open ? "" : " hidden"}>
        <div class="tags">${statusLabel[st]} · ${i.cat === "kewangan" ? "Kewangan" : "Tutorial App & Web"}${i.deadline ? ` · <b>${esc(i.deadline)}</b>` : ""}</div>
        <div><div class="lbl">Kenapa trending</div><p>${esc(i.why)}</p></div>
        ${i.angle ? `<div><div class="lbl">Sudut video</div><p>${esc(i.angle)}</p></div>` : ""}
        ${ideas.length ? `<div><div class="lbl">Idea tajuk</div><ul class="ideas">${ideas.map(t => `<li><span>${esc(t)}</span><button class="mini" data-copy="${esc(t)}">Salin</button></li>`).join("")}</ul></div>` : ""}
        ${srcs ? `<div class="src">Sumber: ${srcs}</div>` : ""}
        <div class="acts">
          <button class="btn pri" data-prompt="${id}">Salin prompt skrip video</button>
          ${state.viewing === "latest" ? `<button class="btn" data-done="${id}">${done ? "Buang tanda" : "Tanda dah buat"}</button>` : ""}
        </div>
      </div>
    </div>`;
  }

  function buildPrompt(item){
    const facts = { tajuk: item.title, kenapa_trending: item.why, sudut: item.angle, idea_tajuk: item.ideas, tarikh_akhir: item.deadline || null, sumber: (item.sources||[]).map(s => s.url) };
    return `Anda penulis skrip untuk channel YouTube Malaysia "Imran Wafi" (niche: tutorial app/website dan kewangan peribadi; gaya santai, bahasa Melayu harian).
Topik trending (fakta, JSON):
${JSON.stringify(facts, null, 1)}

Tulis pakej video dalam Bahasa Melayu. Guna hanya fakta di atas; jangan reka angka atau tarikh.
1. 5 tajuk YouTube (bawah 60 aksara)
2. 3 teks thumbnail (maksimum 4 perkataan)
3. Hook 15 saat pertama
4. Rangka video (5-7 bahagian, dengan anggaran minit)
5. 3 idea Shorts/TikTok
6. Tag & kata kunci carian
7. Perkara yang perlu disemak sebelum rakam`;
  }

  async function copy(text, btn){
    const o = btn.textContent;
    try{ await navigator.clipboard.writeText(text); btn.textContent = "Disalin"; }
    catch(e){ btn.textContent = "Tak dapat salin"; }
    setTimeout(() => btn.textContent = o, 1400);
  }

  function saveDone(){ try{ localStorage.setItem("rt-done", JSON.stringify(state.done)); }catch(e){} }

  document.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if(!b) return;
    if(b.dataset.f){ state.filter = b.dataset.f; document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", String(t === b))); render(); }
    else if(b.dataset.toggle){ const id = b.dataset.toggle; state.open[id] = !state.open[id];
      b.setAttribute("aria-expanded", String(state.open[id])); const d = $("d-" + id); if(d) d.hidden = !state.open[id]; }
    else if(b.dataset.copy != null){ copy(b.dataset.copy, b); }
    else if(b.dataset.prompt){ const it = items().find(x => x.id === b.dataset.prompt); if(it) copy(buildPrompt(it), b); }
    else if(b.dataset.done){ const id = b.dataset.done; if(state.done[id]) delete state.done[id]; else state.done[id] = 1; saveDone(); render(); }
  });
  $("hideDone").addEventListener("change", e => { state.hideDone = e.target.checked; render(); });

  async function getJson(p){ const r = await fetch(p + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error(r.status); return r.json(); }

  $("histSel").addEventListener("change", async e => {
    const v = e.target.value;
    if(v === "latest"){ state.viewing = "latest"; state.data = state.latest; $("banner").textContent = ""; render(); return; }
    try{ const d = await getJson("history/" + v + ".json"); state.viewing = v; state.data = d; state.open = {};
      $("banner").textContent = "Anda sedang lihat senarai lama (" + (d.updated_label || v) + "). Pilih \"Terkini\" untuk kembali."; render(); }catch(err){}
  });

  (async function start(){
    try{ const s = JSON.parse(localStorage.getItem("rt-done") || "{}"); if(s && typeof s === "object") state.done = s; }catch(e){}
    try{ state.latest = state.data = await getJson("data.json"); render(); }
    catch(e){ $("meta").textContent = "Senarai tak dapat dimuatkan. Muat semula halaman ini."; return; }
    try{
      const idx = await getJson("history/index.json");
      const dates = (idx.dates || []).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d !== state.latest.date).sort().reverse().slice(0,14);
      if(dates.length){ $("histWrap").hidden = false; $("histSel").innerHTML = '<option value="latest">Terkini</option>' + dates.map(d => `<option value="${d}">${d}</option>`).join(""); }
    }catch(e){}
  })();
})();
</script>
</body>
</html>
